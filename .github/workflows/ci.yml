name: CI (Dev & Pull Requests)

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Validate, Analyze, Test & Build Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Firebase JSON configs
        run: |
          node -e "JSON.parse(require('fs').readFileSync('firebase.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('.firebaserc', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('firestore.indexes.json', 'utf8'))"
          echo "All Firebase JSON configs are valid."

      - name: Validate redirect engine (r.html syntax & <15KB budget)
        run: |
          node -e "
            const fs = require('fs');
            const html = fs.readFileSync('app/web/r.html', 'utf8');
            const bytes = Buffer.byteLength(html, 'utf8');
            console.log('r.html size:', bytes, 'bytes');
            if (bytes > 15360) {
              throw new Error('r.html exceeds 15KB budget: ' + bytes + ' bytes');
            }
            const match = html.match(/<script>([\s\S]*?)<\/script>/);
            if (!match) throw new Error('Missing inline script in r.html');
            new Function(match[1]);
            console.log('r.html inline JS syntax OK.');
          "

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Static analysis
        working-directory: app
        run: flutter analyze

      - name: Run unit & widget tests
        working-directory: app
        run: flutter test

      - name: Verify Flutter Web release build & fingerprint
        run: |
          cd app && flutter build web --release && cd ..
          node tools/fingerprint_web.mjs app/build/web
