<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Redirecting… | KursorQR</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --accent: #4f46e5;
      --border: #e2e8f0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --card: #1e293b;
        --text: #f8fafc;
        --muted: #94a3b8;
        --accent: #818cf8;
        --border: #334155;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    main {
      width: 100%;
      max-width: 380px;
      padding: 2rem 1.75rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
    }
    .spinner {
      width: 36px;
      height: 36px;
      margin: 0 auto 1.25rem;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 1.125rem; font-weight: 600; margin-bottom: 0.5rem; }
    p { font-size: 0.9rem; color: var(--muted); line-height: 1.5; }
    a.btn {
      display: inline-block;
      margin-top: 1.25rem;
      padding: 0.65rem 1.25rem;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <main>
    <div id="spinner" class="spinner" aria-hidden="true"></div>
    <h1 id="title">Redirecting…</h1>
    <p id="message">Taking you to your destination securely.</p>
    <a id="fallbackLink" class="btn hidden" rel="noopener noreferrer">Continue manually</a>
  </main>

  <script>
    (function () {
      'use strict';

      // =======================================================================
      // CONFIGURATION: Replace with your Firebase Spark project values.
      // Notice: Zero external SDKs, zero cookies, zero localStorage, zero IP
      // logging — talks directly to Firestore REST API for instant <15KB loads.
      // =======================================================================
      const FIREBASE_PROJECT_ID = 'kursorqr';
      const FIREBASE_API_KEY = 'AIzaSyDxcSD5L1rG5yIKPJkhXNvvp-VR0FwIsaA';

      const $spinner = document.getElementById('spinner');
      const $title = document.getElementById('title');
      const $message = document.getElementById('message');
      const $fallbackLink = document.getElementById('fallbackLink');

      function showError(heading, detail) {
        $spinner.classList.add('hidden');
        $title.textContent = heading;
        $message.textContent = detail;
      }

      function extractSlug() {
        const match = window.location.pathname.match(/^\/r\/([^/?#]+)/i);
        if (match && match[1]) {
          try {
            return decodeURIComponent(match[1]).trim();
          } catch (_) {
            return match[1].trim();
          }
        }
        // Optional query-string fallback for local preview (e.g. r.html?slug=demo)
        const querySlug = new URLSearchParams(window.location.search).get('slug');
        return querySlug ? querySlug.trim() : '';
      }

      // Ephemeral in-memory OS detection only — never persisted or logged.
      function detectPlatform() {
        const ua = navigator.userAgent || '';
        const isIOS =
          /iPad|iPhone|iPod/.test(ua) ||
          (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        if (isIOS) return 'ios';
        if (/Android/i.test(ua)) return 'android';
        return 'other';
      }

      // Allow only safe HTTP(S) and native app store redirect schemes.
      function sanitizeTargetUrl(raw) {
        if (typeof raw !== 'string') return '';
        const trimmed = raw.trim();
        if (!trimmed) return '';
        if (/^(https?:\/\/|itms-apps:\/\/|market:\/\/)/i.test(trimmed)) {
          return trimmed;
        }
        return '';
      }

      // Fires an atomic Firestore increment(1) without blocking the redirect.
      // `keepalive: true` ensures the browser completes the POST even after
      // window.location.replace() immediately navigates away.
      function fireAnonymousIncrement(slug, platform) {
        const docPath =
          'projects/' +
          FIREBASE_PROJECT_ID +
          '/databases/(default)/documents/qr_links/' +
          encodeURIComponent(slug);

        const fieldTransforms = [
          { fieldPath: 'totalScans', increment: { integerValue: '1' } }
        ];

        if (platform === 'ios') {
          fieldTransforms.push({
            fieldPath: 'iosScans',
            increment: { integerValue: '1' }
          });
        } else if (platform === 'android') {
          fieldTransforms.push({
            fieldPath: 'androidScans',
            increment: { integerValue: '1' }
          });
        }

        const commitUrl =
          'https://firestore.googleapis.com/v1/projects/' +
          encodeURIComponent(FIREBASE_PROJECT_ID) +
          '/databases/(default)/documents:commit?key=' +
          encodeURIComponent(FIREBASE_API_KEY);

        try {
          fetch(commitUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              writes: [
                {
                  transform: {
                    document: docPath,
                    fieldTransforms: fieldTransforms
                  }
                }
              ]
            }),
            keepalive: true,
            credentials: 'omit',
            referrerPolicy: 'no-referrer'
          }).catch(function () {});
        } catch (_) {
          // Never block redirect if analytics update fails.
        }
      }

      async function run() {
        const slug = extractSlug();
        if (!slug) {
          showError('Invalid QR Link', 'No link identifier was provided in this URL.');
          return;
        }

        const docUrl =
          'https://firestore.googleapis.com/v1/projects/' +
          encodeURIComponent(FIREBASE_PROJECT_ID) +
          '/databases/(default)/documents/qr_links/' +
          encodeURIComponent(slug) +
          '?key=' +
          encodeURIComponent(FIREBASE_API_KEY);

        try {
          const response = await fetch(docUrl, {
            method: 'GET',
            credentials: 'omit',
            referrerPolicy: 'no-referrer',
            cache: 'no-store'
          });

          if (response.status === 404) {
            showError('Link Not Found', 'This QR code does not point to an active destination.');
            return;
          }

          if (!response.ok) {
            showError('Temporary Error', 'Could not resolve this QR code right now. Please try again.');
            return;
          }

          const doc = await response.json();
          const fields = doc.fields || {};

          if (fields.isActive && fields.isActive.booleanValue === false) {
            showError('Link Paused', 'This QR code is currently disabled.');
            return;
          }

          const iosUrl = sanitizeTargetUrl(fields.iosUrl && fields.iosUrl.stringValue);
          const androidUrl = sanitizeTargetUrl(fields.androidUrl && fields.androidUrl.stringValue);
          const webUrl = sanitizeTargetUrl(fields.webUrl && fields.webUrl.stringValue);

          const platform = detectPlatform();
          let target = webUrl;
          if (platform === 'ios' && iosUrl) {
            target = iosUrl;
          } else if (platform === 'android' && androidUrl) {
            target = androidUrl;
          }

          if (!target) {
            showError('Destination Unavailable', 'This QR code has no valid destination URL configured.');
            return;
          }

          // 1. Fire anonymous aggregate counter increment (non-blocking).
          fireAnonymousIncrement(slug, platform);

          // 2. Expose manual fallback button in case an OS/browser intercepts redirect.
          $fallbackLink.href = target;
          $fallbackLink.classList.remove('hidden');

          // 3. Execute instant redirect without polluting browser back-history.
          window.location.replace(target);
        } catch (_) {
          showError('Connection Error', 'Please check your internet connection and scan again.');
        }
      }

      run();
    })();
  </script>
</body>
</html>
