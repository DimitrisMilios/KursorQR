<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#EAE0C8">
  <title>Redirecting… | KursorQR</title>
  <style>
    :root {
      --sand: #EAE0C8;
      --clay: #F7F1E3;
      --clay-deep: #E3D7BC;
      --primary: #8B3103;
      --primary-deep: #5C1F02;
      --primary-light: #C45722;
      --mint: #F0D6C4;
      --text: #2C1608;
      --muted: #78553F;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background: var(--sand);
      color: var(--text);
      font-family: Nunito, "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }
    main {
      width: 100%;
      max-width: 390px;
      padding: 2.25rem 2rem;
      background: var(--clay);
      border-radius: 32px;
      text-align: center;
      box-shadow:
        0 18px 28px rgba(92, 31, 2, 0.18),
        inset 6px 6px 12px rgba(255, 255, 255, 0.9),
        inset -6px -6px 12px rgba(92, 31, 2, 0.14);
    }
    .spinner-well {
      width: 60px;
      height: 60px;
      margin: 0 auto 1.35rem;
      border-radius: 20px;
      background: var(--clay-deep);
      display: grid;
      place-items: center;
      box-shadow:
        inset 4px 4px 8px rgba(92, 31, 2, 0.14),
        inset -4px -4px 8px rgba(255, 255, 255, 0.8);
    }
    .spinner {
      width: 30px;
      height: 30px;
      border: 4px solid var(--mint);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 0.45rem;
    }
    p {
      font-size: 0.93rem;
      color: var(--muted);
      line-height: 1.5;
      font-weight: 500;
    }
    a.btn {
      display: inline-block;
      margin-top: 1.35rem;
      padding: 0.72rem 1.5rem;
      background: var(--primary);
      color: #fff;
      text-decoration: none;
      border-radius: 999px;
      font-size: 0.92rem;
      font-weight: 700;
      box-shadow:
        0 10px 20px rgba(92, 31, 2, 0.28),
        inset 3px 3px 6px rgba(196, 87, 34, 0.55),
        inset -3px -3px 6px rgba(92, 31, 2, 0.55);
      transition: transform 120ms ease-out;
    }
    a.btn:active {
      transform: scale(0.96);
    }
    .hidden { display: none !important; }
    @media (prefers-reduced-motion: reduce) {
      .spinner { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <div id="spinnerWrap" class="spinner-well" aria-hidden="true">
      <div class="spinner"></div>
    </div>
    <h1 id="title">Redirecting…</h1>
    <p id="message">Taking you to your destination securely.</p>
    <a id="fallbackLink" class="btn hidden" rel="noopener noreferrer">Continue manually</a>
  </main>

  <script>
    (function () {
      'use strict';

      // Zero external SDKs, zero cookies, zero localStorage, zero IP logging —
      // talks directly to Firestore REST API for instant <15KB loads.
      const FIREBASE_PROJECT_ID = 'kursorqr';
      const FIREBASE_API_KEY = 'AIzaSyDxcSD5L1rG5yIKPJkhXNvvp-VR0FwIsaA';

      const $spinnerWrap = document.getElementById('spinnerWrap');
      const $title = document.getElementById('title');
      const $message = document.getElementById('message');
      const $fallbackLink = document.getElementById('fallbackLink');

      function showError(heading, detail) {
        $spinnerWrap.classList.add('hidden');
        $title.textContent = heading;
        $message.textContent = detail;
      }

      function extractSlug() {
        const match = window.location.pathname.match(/^\/r\/([^/?#]+)/i);
        if (match && match[1]) {
          try {
            return decodeURIComponent(match[1]).trim();
          } catch (_) {
            return match[1].trim();
          }
        }
        const querySlug = new URLSearchParams(window.location.search).get('slug');
        return querySlug ? querySlug.trim() : '';
      }

      // Ephemeral in-memory OS detection only — never persisted or logged.
      function detectPlatform() {
        const ua = navigator.userAgent || '';
        const isIOS =
          /iPad|iPhone|iPod/.test(ua) ||
          (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        if (isIOS) return 'ios';
        if (/Android/i.test(ua)) return 'android';
        return 'other';
      }

      function sanitizeTargetUrl(raw) {
        if (typeof raw !== 'string') return '';
        const trimmed = raw.trim();
        if (!trimmed) return '';
        if (/^(https?:\/\/|itms-apps:\/\/|market:\/\/)/i.test(trimmed)) {
          return trimmed;
        }
        return '';
      }

      function fireAnonymousIncrement(slug, platform) {
        const docPath =
          'projects/' +
          FIREBASE_PROJECT_ID +
          '/databases/(default)/documents/qr_links/' +
          encodeURIComponent(slug);

        const fieldTransforms = [
          { fieldPath: 'totalScans', increment: { integerValue: '1' } }
        ];

        if (platform === 'ios') {
          fieldTransforms.push({
            fieldPath: 'iosScans',
            increment: { integerValue: '1' }
          });
        } else if (platform === 'android') {
          fieldTransforms.push({
            fieldPath: 'androidScans',
            increment: { integerValue: '1' }
          });
        }

        const commitUrl =
          'https://firestore.googleapis.com/v1/projects/' +
          encodeURIComponent(FIREBASE_PROJECT_ID) +
          '/databases/(default)/documents:commit?key=' +
          encodeURIComponent(FIREBASE_API_KEY);

        try {
          fetch(commitUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              writes: [
                {
                  transform: {
                    document: docPath,
                    fieldTransforms: fieldTransforms
                  }
                }
              ]
            }),
            keepalive: true,
            credentials: 'omit',
            referrerPolicy: 'no-referrer'
          }).catch(function () {});
        } catch (_) {}
      }

      async function run() {
        const slug = extractSlug();
        if (!slug) {
          showError('Invalid QR Link', 'No link identifier was provided in this URL.');
          return;
        }

        const docUrl =
          'https://firestore.googleapis.com/v1/projects/' +
          encodeURIComponent(FIREBASE_PROJECT_ID) +
          '/databases/(default)/documents/qr_links/' +
          encodeURIComponent(slug) +
          '?key=' +
          encodeURIComponent(FIREBASE_API_KEY);

        try {
          const response = await fetch(docUrl, {
            method: 'GET',
            credentials: 'omit',
            referrerPolicy: 'no-referrer',
            cache: 'no-store'
          });

          if (response.status === 404) {
            showError('Link Not Found', 'This QR code does not point to an active destination.');
            return;
          }

          if (!response.ok) {
            showError('Temporary Error', 'Could not resolve this QR code right now. Please try again.');
            return;
          }

          const doc = await response.json();
          const fields = doc.fields || {};

          if (fields.isActive && fields.isActive.booleanValue === false) {
            showError('Link Paused', 'This QR code is currently disabled.');
            return;
          }

          const iosUrl = sanitizeTargetUrl(fields.iosUrl && fields.iosUrl.stringValue);
          const androidUrl = sanitizeTargetUrl(fields.androidUrl && fields.androidUrl.stringValue);
          const webUrl = sanitizeTargetUrl(fields.webUrl && fields.webUrl.stringValue);

          const platform = detectPlatform();
          let target = webUrl;
          if (platform === 'ios' && iosUrl) {
            target = iosUrl;
          } else if (platform === 'android' && androidUrl) {
            target = androidUrl;
          }

          if (!target) {
            showError('Destination Unavailable', 'This QR code has no valid destination URL configured.');
            return;
          }

          fireAnonymousIncrement(slug, platform);

          $fallbackLink.href = target;
          $fallbackLink.classList.remove('hidden');

          window.location.replace(target);
        } catch (_) {
          showError('Connection Error', 'Please check your internet connection and scan again.');
        }
      }

      run();
    })();
  </script>
</body>
</html>
