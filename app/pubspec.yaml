name: kursorqr
description: "KursorQR — Free, open-source, 100% GDPR-compliant dynamic QR code & smart app store redirection platform."
publish_to: 'none'
version: 1.0.1+2
environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  # Firebase (Spark Plan: Auth + Cloud Firestore only — no Cloud Functions)
  firebase_core: ^3.12.0
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.6.0

  # Customizable QR code rendering & high-res PNG export
  pretty_qr_code: ^3.3.0

  # Claymorphism typography, MVVM state binding, and declarative motion
  google_fonts: ^6.2.1
  provider: ^6.1.2
  flutter_animate: ^4.5.0

  # Modern WASM-safe browser interop for one-click PNG download on Flutter Web
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/clay/
